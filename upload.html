<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMZ 업로드 — 고양·파주 도시계획</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;--accent:#4ade80;--text:#e8eaf0;--text2:#8b90a8;--text3:#555a72;--danger:#f87171;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;border-bottom:1px solid var(--border);background:var(--surface);}
.logo{font-size:14px;font-weight:700;}.logo span{color:var(--accent);}
.user-info{margin-left:auto;font-size:12px;color:var(--text2);}
.logout-btn{font-size:12px;color:var(--text3);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;margin-left:8px;}
.nav-btn{font-size:12px;color:var(--text2);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;}
.nav-btn:hover{color:var(--text);}
.container{max-width:680px;margin:0 auto;padding:32px 20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px;}
.card-title{font-size:15px;font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
input,select,textarea{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--surface2);}
textarea{resize:vertical;min-height:80px;}
.color-row{display:flex;align-items:center;gap:10px;}
.color-row input[type="color"]{width:44px;height:38px;padding:2px;cursor:pointer;}
.color-presets{display:flex;gap:6px;flex-wrap:wrap;}
.color-preset{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.15s;}
.color-preset:hover,.color-preset.active{border-color:#fff;}
.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:32px;text-align:center;cursor:pointer;transition:.15s;margin-bottom:16px;}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:#4ade8011;}
.drop-zone .ico{font-size:32px;margin-bottom:8px;}
.drop-zone .txt{font-size:13px;color:var(--text2);}
.drop-zone .sub{font-size:11px;color:var(--text3);margin-top:4px;}
.file-selected{background:#4ade8011;border-color:var(--accent);}
.file-name{font-size:13px;color:var(--accent);font-weight:500;}
.btn{width:100%;padding:12px;background:var(--accent);color:#0f1117;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.btn:hover{background:#22c55e;}
.btn:disabled{background:#555a72;cursor:default;}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:12px;display:none;}
.progress-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}
.msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-top:12px;display:none;}
.msg.error{background:#f8717122;color:var(--danger);display:block;}
.msg.success{background:#4ade8022;color:var(--accent);display:block;}
.history-table{width:100%;border-collapse:collapse;}
.history-table th{font-size:11px;color:var(--text3);font-weight:500;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
.history-table td{font-size:12px;padding:10px 10px;border-bottom:1px solid var(--border);}
.history-table tr:last-child td{border-bottom:none;}
.s-badge{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;}
.s-pending{background:#f59e0b22;color:#f59e0b;}
.s-approved{background:#4ade8022;color:var(--accent);}
.s-rejected{background:#f8717122;color:var(--danger);}
</style>
</head>
<body>
<header>
  <div class="logo">고양·파주 <span>도시계획</span></div>
  <button class="nav-btn" onclick="location.href='index.html'">🗺 지도 보기</button>
  <div class="user-info" id="userInfo"></div>
  <button class="logout-btn" onclick="doLogout()">로그아웃</button>
</header>

<div class="container">

  <!-- 업로드 폼 -->
  <div class="card">
    <div class="card-title">📤 KMZ 파일 업로드</div>

    <!-- 드래그앤드롭 -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="handleDrop(event)">
      <div class="ico">📁</div>
      <div class="txt" id="dropTxt">클릭하거나 KMZ 파일을 드래그해주세요</div>
      <div class="sub">KMZ, KML 파일 지원 · 최대 50MB</div>
    </div>
    <input type="file" id="fileInput" accept=".kmz,.kml" style="display:none" onchange="handleFile(this.files[0])">

    <div class="form-group">
      <label>레이어 이름 (지도에 표시될 이름) *</label>
      <input type="text" id="labelInput" placeholder="예: 서울문산고속도로 신설구간">
    </div>

    <div class="form-group">
      <label>분류</label>
      <select id="typeSelect">
        <option value="road">🛣 도로/교통</option>
        <option value="rail">🚆 철도/GTX</option>
        <option value="dev">🏗 도시개발</option>
        <option value="env">🌿 환경</option>
        <option value="other">📌 기타</option>
      </select>
    </div>

    <div class="form-group">
      <label>레이어 색상</label>
      <div class="color-row">
        <input type="color" id="colorPicker" value="#60a5fa" oninput="syncColor(this.value)">
        <div class="color-presets">
          <div class="color-preset" style="background:#60a5fa" onclick="setColor('#60a5fa')" data-color="#60a5fa"></div>
          <div class="color-preset" style="background:#f472b6" onclick="setColor('#f472b6')" data-color="#f472b6"></div>
          <div class="color-preset" style="background:#4ade80" onclick="setColor('#4ade80')" data-color="#4ade80"></div>
          <div class="color-preset" style="background:#f97316" onclick="setColor('#f97316')" data-color="#f97316"></div>
          <div class="color-preset" style="background:#facc15" onclick="setColor('#facc15')" data-color="#facc15"></div>
          <div class="color-preset" style="background:#a78bfa" onclick="setColor('#a78bfa')" data-color="#a78bfa"></div>
          <div class="color-preset" style="background:#22d3ee" onclick="setColor('#22d3ee')" data-color="#22d3ee"></div>
          <div class="color-preset" style="background:#f87171" onclick="setColor('#f87171')" data-color="#f87171"></div>
          <div class="color-preset" style="background:#34d399" onclick="setColor('#34d399')" data-color="#34d399"></div>
          <div class="color-preset" style="background:#fb923c" onclick="setColor('#fb923c')" data-color="#fb923c"></div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>설명 (선택)</label>
      <textarea id="descInput" placeholder="이 자료에 대한 설명, 출처 등을 입력해주세요"></textarea>
    </div>

    <div id="msgBox" class="msg"></div>
    <div class="progress" id="progressWrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <button class="btn" id="uploadBtn" onclick="doUpload()">업로드 신청</button>
  </div>

  <!-- 내 업로드 목록 -->
  <div class="card">
    <div class="card-title">📋 내 업로드 목록</div>
    <div id="myUploads">로딩 중...</div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://caldnkfhqeblusscaabs.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhbGRua2ZocWVibHVzc2NhYWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMzIzMzUsImV4cCI6MjA5NDkwODMzNX0.z1n5-tqXz5fjy48faxE7nC09zdQKz4_f2mcE6wF8Zls';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let selectedFile = null, currentUser = null;

// 인증 확인
async function checkAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ location.href='login.html'; return; }
  const {data:profile} = await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!profile || !['uploader','admin'].includes(profile.role)){
    alert('업로드 권한이 없어요. 관리자 승인을 기다려주세요.');
    location.href='login.html'; return;
  }
  currentUser = {...session.user, ...profile};
  document.getElementById('userInfo').textContent = profile.name || session.user.email;
  loadMyUploads();
}

function handleFile(file){
  if(!file) return;
  if(file.size > 50*1024*1024){ showMsg('파일이 너무 커요 (최대 50MB)'); return; }
  selectedFile = file;
  const zone = document.getElementById('dropZone');
  zone.classList.add('file-selected');
  document.getElementById('dropTxt').innerHTML = `<span class="file-name">📎 ${file.name}</span>`;
  if(!document.getElementById('labelInput').value){
    document.getElementById('labelInput').value = file.name.replace(/\.(kmz|kml)$/i,'');
  }
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag');
  handleFile(e.dataTransfer.files[0]);
}

function setColor(c){
  document.getElementById('colorPicker').value=c;
  document.querySelectorAll('.color-preset').forEach(el=>el.classList.toggle('active',el.dataset.color===c));
}
function syncColor(c){
  document.querySelectorAll('.color-preset').forEach(el=>el.classList.toggle('active',el.dataset.color===c));
}

function showMsg(msg,type='error'){
  const el=document.getElementById('msgBox');
  el.textContent=msg; el.className='msg '+type;
}

async function doUpload(){
  if(!selectedFile){ showMsg('파일을 선택해주세요'); return; }
  const label = document.getElementById('labelInput').value.trim();
  if(!label){ showMsg('레이어 이름을 입력해주세요'); return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled=true; btn.textContent='업로드 중...';
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('progressBar').style.width='20%';

  try {
    const ext = selectedFile.name.split('.').pop();
    const path = `${currentUser.id}/${Date.now()}.${ext}`;

    // Storage 업로드
    const {error:upErr} = await sb.storage.from('kmz-files').upload(path, selectedFile);
    if(upErr) throw upErr;
    document.getElementById('progressBar').style.width='70%';

    // DB 기록
    const {error:dbErr} = await sb.from('kmz_uploads').insert({
      uploader_id: currentUser.id,
      file_name: selectedFile.name,
      storage_path: path,
      label,
      color: document.getElementById('colorPicker').value,
      layer_type: document.getElementById('typeSelect').value,
      description: document.getElementById('descInput').value,
      status: 'pending'
    });
    if(dbErr) throw dbErr;

    document.getElementById('progressBar').style.width='100%';
    showMsg('업로드 완료! 관리자 검토 후 지도에 반영됩니다.','success');

    // 폼 초기화
    selectedFile=null;
    document.getElementById('dropZone').classList.remove('file-selected');
    document.getElementById('dropTxt').textContent='클릭하거나 KMZ 파일을 드래그해주세요';
    document.getElementById('labelInput').value='';
    document.getElementById('descInput').value='';
    loadMyUploads();
  } catch(e){
    showMsg('업로드 실패: '+e.message);
  }

  btn.disabled=false; btn.textContent='업로드 신청';
  setTimeout(()=>{ document.getElementById('progressWrap').style.display='none'; document.getElementById('progressBar').style.width='0%'; },2000);
}

async function loadMyUploads(){
  const {data} = await sb.from('kmz_uploads').select('*').eq('uploader_id',currentUser?.id).order('created_at',{ascending:false});
  if(!data?.length){ document.getElementById('myUploads').innerHTML='<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">업로드한 파일이 없어요</div>'; return; }
  document.getElementById('myUploads').innerHTML=`
    <table class="history-table">
      <thead><tr><th>파일명</th><th>레이어명</th><th>분류</th><th>상태</th><th>업로드일</th></tr></thead>
      <tbody>${data.map(f=>`
        <tr>
          <td>${f.file_name}</td>
          <td>${f.label}</td>
          <td>${{road:'도로',rail:'철도',dev:'개발',env:'환경',other:'기타'}[f.layer_type]||f.layer_type}</td>
          <td><span class="s-badge s-${f.status}">${{pending:'검토중',approved:'승인됨',rejected:'반려됨'}[f.status]}</span></td>
          <td>${new Date(f.created_at).toLocaleDateString('ko')}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

async function doLogout(){ await sb.auth.signOut(); location.href='login.html'; }

checkAuth();
</script>
</body>
</html>
