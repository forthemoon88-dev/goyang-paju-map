<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — 고양·파주 도시계획</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2e3248;--accent:#4ade80;--text:#e8eaf0;--text2:#8b90a8;--text3:#555a72;--danger:#f87171;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;}
.logo{text-align:center;margin-bottom:28px;}
.logo h1{font-size:18px;font-weight:700;}.logo span{color:var(--accent);}
.logo p{font-size:12px;color:var(--text3);margin-top:4px;}
.tabs{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px;}
.tab{flex:1;padding:8px;font-size:13px;text-align:center;cursor:pointer;background:transparent;border:none;color:var(--text2);font-family:inherit;transition:all .15s;}
.tab.active{background:var(--accent);color:#0f1117;font-weight:500;}
.form-group{margin-bottom:14px;}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
input{width:100%;padding:10px 12px;background:#22263a;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;}
input:focus{border-color:var(--accent);}
.btn{width:100%;padding:11px;background:var(--accent);color:#0f1117;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px;transition:all .15s;}
.btn:hover{background:#22c55e;}
.btn:disabled{background:#555a72;cursor:default;}
.msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none;}
.msg.error{background:#f8717122;color:var(--danger);border:1px solid #f8717144;display:block;}
.msg.success{background:#4ade8022;color:var(--accent);border:1px solid #4ade8044;display:block;}
.pending-box{text-align:center;padding:20px 0;}
.pending-box .icon{font-size:40px;margin-bottom:12px;}
.pending-box h2{font-size:16px;font-weight:500;margin-bottom:8px;}
.pending-box p{font-size:12px;color:var(--text3);line-height:1.6;}
.back-link{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--text3);cursor:pointer;}
.back-link:hover{color:var(--text2);}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>고양·파주 <span>도시계획</span></h1>
    <p>도시계획 정보 공유 플랫폼</p>
  </div>

  <!-- 탭 -->
  <div class="tabs" id="authTabs">
    <button class="tab active" onclick="switchTab('login')">로그인</button>
    <button class="tab" onclick="switchTab('signup')">회원가입</button>
  </div>

  <div id="msgBox" class="msg"></div>

  <!-- 로그인 폼 -->
  <div id="loginForm">
    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="loginEmail" placeholder="이메일 입력">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">로그인</button>
  </div>

  <!-- 회원가입 폼 -->
  <div id="signupForm" style="display:none">
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="signupName" placeholder="이름 입력">
    </div>
    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="signupEmail" placeholder="이메일 입력">
    </div>
    <div class="form-group">
      <label>비밀번호 (6자 이상)</label>
      <input type="password" id="signupPw" placeholder="비밀번호 입력">
    </div>
    <div class="form-group">
      <label>가입 목적</label>
      <input type="text" id="signupPurpose" placeholder="예: 파주시 도로계획 자료 공유">
    </div>
    <button class="btn" id="signupBtn" onclick="doSignup()">회원가입 신청</button>
  </div>

  <!-- 승인 대기 화면 -->
  <div id="pendingBox" class="pending-box" style="display:none">
    <div class="icon">⏳</div>
    <h2>승인 대기 중</h2>
    <p>회원가입 신청이 완료됐어요.<br>관리자 승인 후 파일 업로드가 가능합니다.<br>승인까지 시간이 소요될 수 있어요.</p>
    <span class="back-link" onclick="doLogout()">로그아웃</span>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://caldnkfhqeblusscaabs.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhbGRua2ZocWVibHVzc2NhYWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMzIzMzUsImV4cCI6MjA5NDkwODMzNX0.z1n5-tqXz5fjy48faxE7nC09zdQKz4_f2mcE6wF8Zls';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function showMsg(msg, type='error'){
  const el=document.getElementById('msgBox');
  el.textContent=msg; el.className='msg '+type;
}
function clearMsg(){ document.getElementById('msgBox').className='msg'; }

function switchTab(tab){
  clearMsg();
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='signup')));
  document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
  document.getElementById('signupForm').style.display = tab==='signup'?'block':'none';
}

async function checkUserRole(userId){
  // 여러 방법으로 role 확인 시도
  try {
    const {data, error} = await sb.from('profiles').select('role').eq('id', userId).single();
    console.log('role 조회 결과:', data, error);
    if(data?.role) return data.role;
  } catch(e){ console.warn('role 조회 오류:', e); }
  return 'pending';
}

async function redirectByRole(role){
  console.log('redirectByRole 호출:', role);
  if(role==='admin') window.location.href='admin.html';
  else if(role==='uploader') window.location.href='upload.html';
  else showPending();
}

function showPending(){
  document.getElementById('authTabs').style.display='none';
  document.getElementById('loginForm').style.display='none';
  document.getElementById('signupForm').style.display='none';
  document.getElementById('pendingBox').style.display='block';
  clearMsg();
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pw=document.getElementById('loginPw').value;
  if(!email||!pw){ showMsg('이메일과 비밀번호를 입력해주세요'); return; }
  const btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='로그인 중...';
  const {data,error} = await sb.auth.signInWithPassword({email,password:pw});
  if(error){ showMsg('이메일 또는 비밀번호가 올바르지 않아요'); btn.disabled=false; btn.textContent='로그인'; return; }
  const role = await checkUserRole(data.user.id);
  await redirectByRole(role);
  btn.disabled=false; btn.textContent='로그인';
}

async function doSignup(){
  const name=document.getElementById('signupName').value.trim();
  const email=document.getElementById('signupEmail').value.trim();
  const pw=document.getElementById('signupPw').value;
  const purpose=document.getElementById('signupPurpose').value.trim();
  if(!name||!email||!pw){ showMsg('모든 항목을 입력해주세요'); return; }
  if(pw.length<6){ showMsg('비밀번호는 6자 이상이어야 해요'); return; }
  const btn=document.getElementById('signupBtn');
  btn.disabled=true; btn.textContent='신청 중...';
  const {data,error} = await sb.auth.signUp({
    email, password:pw,
    options:{ data:{ name, purpose } }
  });
  if(error){ showMsg(error.message); btn.disabled=false; btn.textContent='회원가입 신청'; return; }
  showMsg('회원가입 신청 완료! 관리자 승인을 기다려주세요.','success');
  setTimeout(showPending, 1500);
  btn.disabled=false; btn.textContent='회원가입 신청';
}

async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}

// 이미 로그인된 경우 자동 리디렉션
sb.auth.getSession().then(async({data:{session}})=>{
  if(session){
    const role = await checkUserRole(session.user.id);
    await redirectByRole(role);
  }
});
</script>
</body>
</html>
