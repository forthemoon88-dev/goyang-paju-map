<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고양·파주 도시계획 지도</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e7bab8ddea307ac3c4f861f4a2ff00cc&libraries=services&autoload=false"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;
  --accent:#4ade80;--text:#e8eaf0;--text2:#8b90a8;--text3:#555a72;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* 헤더 */
header{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;z-index:100;}
.logo{font-size:14px;font-weight:700;white-space:nowrap;}.logo span{color:var(--accent);}
.search-wrap{flex:1;max-width:300px;position:relative;}
.search-wrap input{width:100%;padding:6px 12px 6px 30px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.s-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text3);}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.loading-pill{font-size:11px;color:var(--text3);display:none;align-items:center;gap:5px;padding:3px 10px;background:var(--surface2);border-radius:99px;border:1px solid var(--border);}
.loading-pill.show{display:flex;}
.spin{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{padding:5px 12px;border-radius:7px;font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);}
.btn:hover{background:var(--surface2);color:var(--text);}

/* 메인 */
.main{display:flex;flex:1;overflow:hidden;}

/* 사이드바 */
.sidebar{width:272px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}

/* 레이어 패널 */
.layer-panel{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.layer-panel::-webkit-scrollbar{width:4px;}
.layer-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.panel-section{border-bottom:1px solid var(--border);}
.panel-title{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;user-select:none;}
.panel-title:hover{background:var(--surface2);}
.panel-arrow{font-size:10px;transition:transform .2s;margin-left:auto;}
.panel-arrow.open{transform:rotate(90deg);}
.panel-body{display:none;}
.panel-body.open{display:block;}

/* 레이어 아이템 */
.layer-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.layer-item:last-child{border-bottom:none;}
.layer-item:hover{background:var(--surface2);}
.layer-item.active{background:var(--surface2);border-left:2px solid var(--accent);}
.layer-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.layer-name{font-size:12px;font-weight:500;color:var(--text);flex:1;line-height:1.3;}
.layer-count{font-size:10px;color:var(--text3);background:var(--surface);padding:1px 5px;border-radius:99px;border:1px solid var(--border);}
.layer-eye{font-size:13px;color:var(--text3);cursor:pointer;padding:2px 4px;border-radius:4px;}
.layer-eye:hover{color:var(--accent);}
.layer-sub{padding:4px 12px 4px 30px;font-size:11px;color:var(--text3);}

/* 필지 토글 */
.parcel-section{border-bottom:1px solid var(--border);}
.parcel-row{display:flex;align-items:center;gap:7px;padding:8px 12px;}
.parcel-row span{font-size:12px;color:var(--text2);}
.tog-btn{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-family:inherit;}
.tog-btn.on{background:#22d3ee22;color:#22d3ee;border-color:#22d3ee;}
.parcel-options{padding:4px 12px 8px;display:none;gap:6px;flex-wrap:wrap;}
.parcel-options.show{display:flex;}
.opt-btn{padding:2px 8px;font-size:11px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-family:inherit;}
.opt-btn.active{background:var(--accent);color:#0f1117;border-color:var(--accent);}

/* 지도 */
.map-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#gmap{flex:1;min-height:0;}

/* 범례 — 드래그 가능 */
.legend{position:absolute;bottom:10px;left:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11px;z-index:20;max-width:160px;max-height:40vh;overflow-y:auto;cursor:move;user-select:none;}
.legend::-webkit-scrollbar{width:3px;}
.legend-h{font-weight:500;color:var(--text2);margin-bottom:6px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;color:var(--text2);font-size:11px;}
.l-box{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.l-line{width:18px;height:4px;border-radius:2px;flex-shrink:0;}
.l-sep{border:none;border-top:1px solid var(--border);margin:5px 0;}
.l-status{display:flex;align-items:center;gap:5px;margin-bottom:2px;color:var(--text3);font-size:10px;}
.l-dot{width:5px;height:5px;border-radius:50%;}

/* 지적편집도 버튼 */
.cadastral-btn{
  position:absolute;bottom:10px;right:10px;
  padding:6px 12px;font-size:12px;font-weight:500;
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;color:var(--text2);
  z-index:20;font-family:inherit;
  display:flex;align-items:center;gap:5px;
  transition:all .15s;
}
.cadastral-btn:hover{background:var(--surface2);color:var(--text);}
.cadastral-btn.on{background:#4ade8022;color:#4ade80;border-color:#4ade80;}

/* 그리기 도구 */
.draw-toolbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 10px;}
.draw-btn{padding:5px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;}
.draw-btn:hover{background:var(--surface2);color:var(--text);}
.draw-btn.active{background:var(--accent);color:#0f1117;border-color:var(--accent);}
.draw-color-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.my-marker-info{font-size:12px;line-height:1.8;color:#111;min-width:180px;padding:8px 10px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.detail{height:0;flex-shrink:0;border-top:0;background:var(--surface);overflow:hidden;transition:height .2s;}
.detail.show{height:180px;border-top:1px solid var(--border);}
.detail-inner{padding:12px 16px;height:100%;overflow-y:auto;}
.d-title{font-size:14px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.d-close{margin-left:auto;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:transparent;}
.d-close:hover{color:var(--text);}
.d-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
.df-l{font-size:10px;color:var(--text3);margin-bottom:1px;}
.df-v{font-size:12px;color:var(--text);font-weight:500;}
.d-desc{font-size:12px;color:var(--text2);line-height:1.7;}
</style>
</head>
<body>

<header>
  <div class="logo">고양·파주 <span>도시계획</span></div>
  <div class="search-wrap">
    <span class="s-ico">🔍</span>
    <input type="text" placeholder="레이어·지명 검색...">
  </div>
  <div class="hdr-right">
    <div class="loading-pill" id="loadingPill">
      <div class="spin"></div>
      <span id="loadingText">로딩 중...</span>
    </div>
    <div id="authBtns">
      <button class="btn" onclick="location.href='login.html'" style="font-size:12px;padding:5px 12px">로그인</button>
      <button class="btn" onclick="location.href='login.html#signup'" style="font-size:12px;padding:5px 12px;background:var(--accent);color:#0f1117;border-color:var(--accent)">회원가입</button>
    </div>
    <div id="userBtns" style="display:none;align-items:center;gap:8px">
      <span id="userNameBadge" style="font-size:12px;color:var(--text2)"></span>
      <button class="btn" id="adminBtn" onclick="location.href='admin.html'" style="display:none;font-size:12px;padding:5px 12px">관리자</button>
      <button class="btn" onclick="location.href='upload.html'" style="font-size:12px;padding:5px 12px">📤 업로드</button>
      <button class="btn" onclick="doLogout()" style="font-size:12px;padding:5px 12px">로그아웃</button>
    </div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="layer-panel" id="layerPanel">

      <!-- KMZ 레이어 섹션 -->
      <div class="panel-section">
        <div class="panel-title" onclick="toggleSection('kmzSection')">
          <span>🗂</span> KMZ 레이어
          <span class="panel-arrow open" id="kmzSectionArrow">▶</span>
        </div>
        <div class="panel-body open" id="kmzSection">
          <div id="layerList">
            <div style="padding:12px;font-size:12px;color:var(--text3)">레이어 로딩 중...</div>
          </div>
        </div>
      </div>

      

      <!-- 내 그리기 섹션 -->
      <div class="panel-section" id="myDrawingSection" style="display:none">
        <div class="panel-title" onclick="toggleSection('myDrawingBody')">
          <span>✏</span> 내 그리기
          <span class="panel-arrow" id="myDrawingBodyArrow">▶</span>
          <span class="layer-count" id="drawingCount" style="margin-left:4px">0</span>
        </div>
        <div class="panel-body" id="myDrawingBody">
          <div id="myDrawingList" style="max-height:200px;overflow-y:auto;"></div>
        </div>
      </div>

      <!-- 내 마커 섹션 -->
      <div class="panel-section" id="myMarkerSection" style="display:none">
        <div class="panel-title" onclick="toggleSection('myMarkerBody')">
          <span>📍</span> 내 마커
          <span class="panel-arrow" id="myMarkerBodyArrow">▶</span>
          <span class="layer-count" id="markerCount" style="margin-left:4px">0</span>
        </div>
        <div class="panel-body" id="myMarkerBody">
          <div id="myMarkerList" style="max-height:200px;overflow-y:auto;"></div>
        </div>
      </div>

      <!-- 내 이미지 오버레이 섹션 -->
      <div class="panel-section" id="myOverlaySection" style="display:none">
        <div class="panel-title" onclick="toggleSection('myOverlayBody')">
          <span>🖼</span> 내 이미지 오버레이
          <span class="panel-arrow" id="myOverlayBodyArrow">▶</span>
          <span class="layer-count" id="overlayCount" style="margin-left:4px">0</span>
        </div>
        <div class="panel-body" id="myOverlayBody">
          <div id="mySidebarOverlayList" style="max-height:200px;overflow-y:auto;"></div>
        </div>
      </div>

    </div>
  </div>

  <div class="map-wrap">
    <div id="gmap"></div>

    <div class="legend" id="mapLegend">
      <div class="legend-h">레이어</div>
      <div id="legendItems"></div>
      <div id="parcelLegend" style="display:none">
        <hr class="l-sep">
        <div class="legend-h" style="color:#22d3ee">필지 색상</div>
        <div id="parcelLegendItems"></div>
      </div>
    </div>

    <!-- 그리기 도구 -->
    <div class="draw-toolbar" id="drawToolbar">
      <button class="draw-btn active" id="btnSelect" onclick="setDrawMode('select')">🖱 선택</button>
      <button class="draw-btn" id="btnMarker" onclick="setDrawMode('marker')">📍 마커</button>
      <button class="draw-btn" id="btnLine" onclick="setDrawMode('line')">📏 선</button>
      <button class="draw-btn" id="btnPolygon" onclick="setDrawMode('polygon')">⬡ 영역</button>
      <button class="draw-btn" id="btnOverlay" onclick="openOverlayPanel()">🖼 이미지</button>
      <input type="color" id="drawColor" value="#ef4444" style="width:28px;height:28px;padding:2px;border-radius:6px;border:1px solid var(--border);cursor:pointer;background:transparent;">
      <button class="draw-btn" onclick="clearMyDrawings()" style="color:#f87171;">🗑 삭제</button>
    </div>

    <!-- 그리기 저장 모달 -->
    <div id="drawingModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1001;align-items:center;justify-content:center;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:340px;max-width:90vw;">
        <div style="font-size:15px;font-weight:500;margin-bottom:16px;" id="drawingModalTitle">📏 그리기 저장</div>
        <div style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">제목</label>
          <input id="drawingTitle" type="text" placeholder="예: 관심 구역" style="width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;">
        </div>
        <div style="margin-bottom:16px;">
          <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">메모</label>
          <textarea id="drawingMemo" rows="3" placeholder="메모 입력 (선택)" style="width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;resize:vertical;"></textarea>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button onclick="closeDrawingModal()" style="padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;font-size:13px;">저장 안 함</button>
          <button onclick="saveDrawing()" style="padding:8px 16px;border-radius:8px;border:none;background:var(--accent);color:#0f1117;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;">저장</button>
        </div>
      </div>
    </div>

    <!-- 마커 메모 모달 -->
    <div id="markerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:340px;max-width:90vw;">
        <div style="font-size:15px;font-weight:500;margin-bottom:16px;" class="modal-title">📍 마커 정보 입력</div>
        <div style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">제목 *</label>
          <input id="markerTitle" type="text" placeholder="예: 운정3지구 예정지" style="width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;">
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">내용</label>
          <textarea id="markerContent" placeholder="메모, 분석 내용 등 자유롭게 입력" rows="4" style="width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;resize:vertical;"></textarea>
        </div>
        <div style="margin-bottom:16px;">
          <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">마커 색상</label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <div onclick="selectMarkerColor('#ef4444',this)" style="width:22px;height:22px;border-radius:50%;background:#ef4444;cursor:pointer;border:2px solid #fff;" class="mcolor active"></div>
            <div onclick="selectMarkerColor('#f97316',this)" style="width:22px;height:22px;border-radius:50%;background:#f97316;cursor:pointer;border:2px solid transparent;" class="mcolor"></div>
            <div onclick="selectMarkerColor('#facc15',this)" style="width:22px;height:22px;border-radius:50%;background:#facc15;cursor:pointer;border:2px solid transparent;" class="mcolor"></div>
            <div onclick="selectMarkerColor('#4ade80',this)" style="width:22px;height:22px;border-radius:50%;background:#4ade80;cursor:pointer;border:2px solid transparent;" class="mcolor"></div>
            <div onclick="selectMarkerColor('#60a5fa',this)" style="width:22px;height:22px;border-radius:50%;background:#60a5fa;cursor:pointer;border:2px solid transparent;" class="mcolor"></div>
            <div onclick="selectMarkerColor('#a78bfa',this)" style="width:22px;height:22px;border-radius:50%;background:#a78bfa;cursor:pointer;border:2px solid transparent;" class="mcolor"></div>
            <div onclick="selectMarkerColor('#f472b6',this)" style="width:22px;height:22px;border-radius:50%;background:#f472b6;cursor:pointer;border:2px solid transparent;" class="mcolor"></div>
            <div onclick="selectMarkerColor('#94a3b8',this)" style="width:22px;height:22px;border-radius:50%;background:#94a3b8;cursor:pointer;border:2px solid transparent;" class="mcolor"></div>
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button onclick="closeMarkerModal()" style="padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;font-size:13px;">취소</button>
          <button onclick="saveMarker()" style="padding:8px 16px;border-radius:8px;border:none;background:var(--accent);color:#0f1117;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;">저장</button>
        </div>
      </div>
    </div>

    <!-- 이미지 오버레이 패널 -->
    <div id="overlayPanel" style="display:none;position:absolute;top:60px;right:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;width:260px;z-index:30;">
      <div style="font-size:13px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">
        🖼 이미지 오버레이
        <span onclick="closeOverlayPanel()" style="cursor:pointer;color:var(--text3);font-size:16px;">✕</span>
      </div>
      <div id="overlayDropZone" onclick="document.getElementById('overlayFileInput').click()"
        ondragover="event.preventDefault();this.style.borderColor='var(--accent)'"
        ondragleave="this.style.borderColor='var(--border)'"
        ondrop="handleOverlayDrop(event)"
        style="border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;margin-bottom:10px;font-size:12px;color:var(--text3);">
        클릭 또는 드래그<br>PNG/JPG 이미지
      </div>
      <input type="file" id="overlayFileInput" accept="image/*" style="display:none" onchange="handleOverlayFile(this.files[0])">
      <div style="margin-bottom:8px;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:3px;">이름</label>
        <input id="overlayTitle" type="text" placeholder="오버레이 이름" style="width:100%;padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:inherit;outline:none;">
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:3px;">투명도: <span id="opacityVal">70%</span></label>
        <input type="range" id="overlayOpacity" min="10" max="100" value="70" oninput="document.getElementById('opacityVal').textContent=this.value+'%'" style="width:100%;">
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px;">이미지 선택 후 지도에서 좌측하단→우측상단 순서로 클릭해 위치를 지정하세요</div>
      <div id="overlayStatus" style="font-size:11px;color:var(--accent);margin-bottom:8px;display:none;"></div>
      <button onclick="saveOverlay()" id="overlaySubmitBtn" disabled style="width:100%;padding:8px;border-radius:8px;border:none;background:var(--accent);color:#0f1117;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;opacity:.5;">위치 지정 후 저장</button>

      <!-- 내 오버레이 목록 -->
      <div id="myOverlayList" style="margin-top:12px;"></div>
    </div>

    <!-- 지적편집도 버튼 -->

async function loadLayer(layerInfo) {
  if (layerData[layerInfo.id]) { renderLayerOverlays(layerInfo.id); return; }
  if (layerInfo.type === 'parcel') return; // 필지는 별도 처리
  loading(`${layerInfo.label || layerInfo.id} 로딩...`);
  try {
    const res = await fetch(GITHUB_RAW + layerInfo.file);
    const data = await res.json();
    layerData[layerInfo.id] = data;
    renderLayerOverlays(layerInfo.id);
  } catch(e) { console.warn('레이어 로드 실패:', layerInfo.id, e); }
  loading('');
}

function renderLayerOverlays(layerId) {
  // 기존 오버레이 제거
  if (layerOverlays[layerId]) {
    layerOverlays[layerId].forEach(o => { if(o.setMap) o.setMap(null); });
  }
  layerOverlays[layerId] = [];
  if (!layerVisible[layerId] || !layerData[layerId]) return;

  const data = layerData[layerId];
  const layerInfo = layers.find(l => l.id === layerId);
  const color = layerInfo?.color || '#60a5fa';
  const features = data.features || [];

  features.forEach(f => {
    const coords = f.coords;
    if (!coords || coords.length === 0) return;

    if (f.geom === 'marker' || coords.length === 1) {
      const pos = new kakao.maps.LatLng(coords[0][0], coords[0][1]);
      const el = document.createElement('div');
      el.style.cssText = `width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.4)`;
      const ov = new kakao.maps.CustomOverlay({position:pos, content:el, zIndex:3});
      ov.setMap(map);
      el.addEventListener('click', () => showDetail(f, color));
      layerOverlays[layerId].push(ov);

    } else if (f.geom === 'polygon') {
      const path = coords.map(c => new kakao.maps.LatLng(c[0], c[1]));
      const poly = new kakao.maps.Polygon({
        path, strokeWeight:1.5, strokeColor:color, strokeOpacity:.85,
        fillColor:color, fillOpacity:.3
      });
      poly.setMap(map);
      kakao.maps.event.addListener(poly, 'click', () => showDetail(f, color));
      layerOverlays[layerId].push(poly);

    } else if (f.geom === 'line') {
      const path = coords.map(c => new kakao.maps.LatLng(c[0], c[1]));
      const outline = new kakao.maps.Polyline({
        path, strokeWeight:6, strokeColor:'#ffffff', strokeOpacity:.35, strokeStyle:'solid'
      });
      const line = new kakao.maps.Polyline({
        path, strokeWeight:4, strokeColor:color, strokeOpacity:.9, strokeStyle:'solid'
      });
      outline.setMap(map); line.setMap(map);
      kakao.maps.event.addListener(line, 'click', () => showDetail(f, color));
      layerOverlays[layerId].push(outline, line);
    }
  });
}

function toggleLayerVisibility(layerId, e) {
  e && e.stopPropagation();
  layerVisible[layerId] = !layerVisible[layerId];
  const layerInfo = layers.find(l => l.id === layerId);
  if (layerVisible[layerId] && !layerData[layerId]) {
    loadLayer(layerInfo);
  } else {
    renderLayerOverlays(layerId);
  }
  renderLayerList();
}

/* ════════════════════════════════
   그리기 기능
════════════════════════════════ */
let drawMode = 'select';
let myDrawings = [];
let drawingPath = [];
let drawingOverlay = null;
let drawingDots = [];
let drawClickListener = null;
let drawRightClickListener = null;
let draggingDotIdx = -1;

function setDrawMode(mode) {
  drawMode = mode;
  document.querySelectorAll('.draw-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1));
  if (btn) btn.classList.add('active');

  clearDrawingDots();
  if (drawingOverlay) { drawingOverlay.setMap(null); drawingOverlay = null; }
  drawingPath = [];

  if (mode === 'select') {
    map.setDraggable(true);
    map.setCursor('');
  } else {
    map.setDraggable(false);
    map.setCursor('crosshair');
  }
}

// 단일 클릭 핸들러 - 항상 등록, drawMode로 분기
function onMapClick(e) {
  if (drawMode === 'select' || drawMode === 'image') return;
  if (drawMode === 'marker') { openMarkerModal(e.latLng); return; }
  if (drawMode === 'line' || drawMode === 'polygon') {
    const idx = drawingPath.length;
    drawingPath.push(e.latLng);
    addDrawingDot(e.latLng, idx);
    updateDrawingOverlay();
  }
}

// 단일 우클릭 핸들러
function onMapRightClick() {
  if (drawMode === 'line' && drawingPath.length >= 2) { finalizeLine(); return; }
  if (drawMode === 'polygon' && drawingPath.length >= 3) { finalizePolygon(); return; }
}

function updateDrawingOverlay() {
  if (drawingOverlay) { drawingOverlay.setMap(null); drawingOverlay = null; }
  const color = document.getElementById('drawColor').value;
  if (drawMode === 'line' && drawingPath.length >= 2) {
    drawingOverlay = new kakao.maps.Polyline({
      path: [...drawingPath], strokeColor: color, strokeWeight: 3, strokeOpacity: .9, strokeStyle: 'solid'
    });
    drawingOverlay.setMap(map);
  } else if (drawMode === 'polygon' && drawingPath.length >= 3) {
    drawingOverlay = new kakao.maps.Polygon({
      path: [...drawingPath], strokeColor: color, strokeWeight: 2, strokeOpacity: .9, fillColor: color, fillOpacity: .25
    });
    drawingOverlay.setMap(map);
  }
}

function finalizeLine() {
  const color = document.getElementById('drawColor').value;
  const line = new kakao.maps.Polyline({
    path: [...drawingPath], strokeColor: color, strokeWeight: 3, strokeOpacity: .9, strokeStyle: 'solid'
  });
  line.setMap(map);
  const idx = myDrawings.length;
  const savedPath = [...drawingPath];
  myDrawings.push(line);
  kakao.maps.event.addListener(line, 'click', e => showMyDrawingInfo(e.latLng, '선', idx));
  if (drawingOverlay) { drawingOverlay.setMap(null); drawingOverlay = null; }
  clearDrawingDots(); drawingPath = [];
  openDrawingModal('line', color, savedPath, idx);
}

function finalizePolygon() {
  const color = document.getElementById('drawColor').value;
  const poly = new kakao.maps.Polygon({
    path: [...drawingPath], strokeColor: color, strokeWeight: 2, strokeOpacity: .9, fillColor: color, fillOpacity: .25
  });
  poly.setMap(map);
  const idx = myDrawings.length;
  const savedPath = [...drawingPath];
  myDrawings.push(poly);
  kakao.maps.event.addListener(poly, 'click', e => showMyDrawingInfo(e.latLng, '영역', idx));
  if (drawingOverlay) { drawingOverlay.setMap(null); drawingOverlay = null; }
  clearDrawingDots(); drawingPath = [];
  // 저장 모달
  openDrawingModal('polygon', color, savedPath, idx);
}

// 번호 점 표시 + 드래그로 수정
function addDrawingDot(latLng, idx) {
  const color = document.getElementById('drawColor').value;
  const el = document.createElement('div');
  el.style.cssText = `width:22px;height:22px;border-radius:50%;background:${color};border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:700;color:#fff;transform:translate(-11px,-11px);
    cursor:grab;font-family:sans-serif;user-select:none;`;
  el.textContent = idx + 1;

  el.addEventListener('mousedown', ev => {
    ev.stopPropagation();
    draggingDotIdx = idx;
    el.style.cursor = 'grabbing';
    const mapEl = document.getElementById('gmap');

    const onMove = ev2 => {
      if (draggingDotIdx < 0) return;
      const rect = mapEl.getBoundingClientRect();
      const proj = map.getProjection();
      const newLatLng = proj.coordsFromContainerPoint(
        new kakao.maps.Point(ev2.clientX - rect.left, ev2.clientY - rect.top)
      );
      drawingPath[draggingDotIdx] = newLatLng;
      drawingDots[draggingDotIdx].setPosition(newLatLng);
      updateDrawingOverlay();
    };
    const onUp = () => {
      draggingDotIdx = -1;
      el.style.cursor = 'grab';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  const ov = new kakao.maps.CustomOverlay({ position: latLng, content: el, zIndex: 15 });
  ov.setMap(map);
  drawingDots.push(ov);
}

function clearDrawingDots() {
  drawingDots.forEach(o => o.setMap(null));
  drawingDots = [];
}

function placeMyMarker(latLng) {
  const color = document.getElementById('drawColor').value;
  const el = document.createElement('div');
  el.innerHTML = `<div style="width:24px;height:24px;border-radius:50% 50% 50% 0;background:${color};border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,0.3);cursor:pointer"></div>`;
  el.style.cssText = 'transform:translate(-12px,-24px)';
  const ov = new kakao.maps.CustomOverlay({position:latLng, content:el, zIndex:5});
  ov.setMap(map);
  const idx = myDrawings.length;
  myDrawings.push(ov);
  el.addEventListener('click', () => showMyDrawingInfo(latLng, '마커', idx));
}

let myInfoWin = null;
function showMyDrawingInfo(pos, type, idx) {
  if (myInfoWin) { myInfoWin.setMap(null); myInfoWin = null; }
  const el = document.createElement('div');
  el.className = 'my-marker-info';
  el.innerHTML = `<b>${type}</b><br>위도: ${pos.getLat().toFixed(5)}<br>경도: ${pos.getLng().toFixed(5)}<br>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button onclick="deleteMyDrawing(${idx})" style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid #f87171;background:#fff;color:#f87171;cursor:pointer">삭제</button>
      <button onclick="closeMyInfo()" style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid #ccc;background:#fff;cursor:pointer">닫기</button>
    </div>`;
  const wrap = document.createElement('div');
  wrap.appendChild(el);
  myInfoWin = new kakao.maps.CustomOverlay({position:pos, content:wrap, zIndex:10, yAnchor:1.3});
  myInfoWin.setMap(map);
}

function closeMyInfo() { if (myInfoWin) { myInfoWin.setMap(null); myInfoWin = null; } }

function deleteMyDrawing(idx) {
  if (myDrawings[idx]) { myDrawings[idx].setMap(null); myDrawings[idx] = null; }
  closeMyInfo();
}

function clearMyDrawings() {
  if (!confirm('내 그리기를 모두 삭제할까요?')) return;
  myDrawings.forEach(o => { if(o && o.setMap) o.setMap(null); });
  myDrawings = [];
  closeMyInfo();
}

/* ════════════════════════════════
   그리기 저장 / 복원
════════════════════════════════ */
let pendingDrawing = null;
let savedDrawingOverlays = {}; // id → overlay

function openDrawingModal(type, color, path, idx) {
  pendingDrawing = { type, color, path, idx };
  document.getElementById('drawingTitle').value = '';
  document.getElementById('drawingMemo').value = '';
  document.getElementById('drawingModalTitle').textContent =
    type === 'polygon' ? '⬡ 영역 저장' : '📏 선 저장';
  document.getElementById('drawingModal').style.display = 'flex';
  setTimeout(() => document.getElementById('drawingTitle').focus(), 100);
}

function closeDrawingModal() {
  document.getElementById('drawingModal').style.display = 'none';
  pendingDrawing = null;
}

async function saveDrawing() {
  if (!pendingDrawing) return;
  if (!window._sb) { closeDrawingModal(); return; }
  const { data: { session } } = await window._sb.auth.getSession();
  if (!session) { alert('로그인이 필요해요'); closeDrawingModal(); return; }

  const title = document.getElementById('drawingTitle').value.trim() ||
    (pendingDrawing.type === 'polygon' ? '영역' : '선');
  const memo = document.getElementById('drawingMemo').value;
  const coords = pendingDrawing.path.map(ll => [ll.getLat(), ll.getLng()]);

  const { error } = await window._sb.from('drawings').insert({
    user_id: session.user.id,
    title, content: memo,
    type: pendingDrawing.type,
    color: pendingDrawing.color,
    coords
  });

  if (error) { alert('저장 실패: ' + error.message); return; }
  closeDrawingModal();
  loadMyDrawings();
}

async function loadMyDrawings() {
  if (!window._sb) return;
  const { data: { session } } = await window._sb.auth.getSession();
  if (!session) return;

  const { data } = await window._sb.from('drawings').select('*')
    .eq('user_id', session.user.id).order('created_at', { ascending: false });

  // 기존 오버레이 제거
  Object.values(savedDrawingOverlays).forEach(o => { if(o && o.setMap) o.setMap(null); });
  savedDrawingOverlays = {};

  // 사이드바 섹션
  const section = document.getElementById('myDrawingSection');
  const countEl = document.getElementById('drawingCount');
  const listEl = document.getElementById('myDrawingList');

  if (!data?.length) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  countEl.textContent = data.length;

  // 지도에 복원
  data.forEach(d => {
    const path = d.coords.map(c => new kakao.maps.LatLng(c[0], c[1]));
    let ov;
    if (d.type === 'polygon') {
      ov = new kakao.maps.Polygon({
        path, strokeColor: d.color, strokeWeight: 2,
        strokeOpacity: .9, fillColor: d.color, fillOpacity: .25
      });
    } else {
      ov = new kakao.maps.Polyline({
        path, strokeColor: d.color, strokeWeight: 3,
        strokeOpacity: .9, strokeStyle: 'solid'
      });
    }
    ov.setMap(map);
    savedDrawingOverlays[d.id] = ov;
    kakao.maps.event.addListener(ov, 'click', e => showSavedDrawingInfo(d, e.latLng));
  });

  // 사이드바 목록
  listEl.innerHTML = data.map(d => `
    <div class="layer-item" style="padding-left:10px" id="drawing-item-${d.id}">
      <span style="font-size:12px">${d.type==='polygon'?'⬡':'📏'}</span>
      <span class="layer-name" style="cursor:pointer" onclick="focusDrawing('${d.id}')">${d.title}</span>
      <span class="layer-eye" onclick="toggleDrawingVisible('${d.id}')" title="표시/숨기기">👁</span>
      <span class="layer-eye" style="color:#f87171" onclick="deleteDrawing('${d.id}')" title="삭제">🗑</span>
    </div>`).join('');

  window._drawingData = {};
  data.forEach(d => { window._drawingData[d.id] = d; });
}

let hiddenDrawings = new Set();
function toggleDrawingVisible(id) {
  const ov = savedDrawingOverlays[id];
  if (!ov) return;
  const eyeEl = document.querySelector(`#drawing-item-${id} .layer-eye`);
  if (hiddenDrawings.has(id)) {
    hiddenDrawings.delete(id);
    ov.setMap(map);
    if (eyeEl) eyeEl.textContent = '👁';
  } else {
    hiddenDrawings.add(id);
    ov.setMap(null);
    if (eyeEl) eyeEl.textContent = '🚫';
  }
}

function focusDrawing(id) {
  const d = window._drawingData?.[id];
  if (!d?.coords?.length) return;
  const lats = d.coords.map(c=>c[0]), lngs = d.coords.map(c=>c[1]);
  map.setBounds(new kakao.maps.LatLngBounds(
    new kakao.maps.LatLng(Math.min(...lats), Math.min(...lngs)),
    new kakao.maps.LatLng(Math.max(...lats), Math.max(...lngs))
  ));
}

let drawingInfoWin = null;
function showSavedDrawingInfo(d, pos) {
  if (drawingInfoWin) { drawingInfoWin.setMap(null); drawingInfoWin = null; }
  const el = document.createElement('div');
  el.style.cssText = 'background:#fff;border-radius:10px;padding:12px 14px;min-width:180px;box-shadow:0 3px 12px rgba(0,0,0,0.2);font-family:Noto Sans KR,sans-serif;';
  el.innerHTML = `
    <div style="font-size:13px;font-weight:700;color:#111;margin-bottom:4px;display:flex;justify-content:space-between;">
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${d.color};margin-right:5px;"></span>${d.title}</span>
      <span onclick="closeDrawingInfo()" style="cursor:pointer;color:#999;font-size:15px;">✕</span>
    </div>
    ${d.content?`<div style="font-size:12px;color:#444;margin-bottom:6px;">${d.content}</div>`:''}
    <div style="font-size:10px;color:#999;margin-bottom:8px;">${new Date(d.created_at).toLocaleString('ko')}</div>
    <button onclick="deleteDrawing('${d.id}')" style="width:100%;padding:5px;border-radius:6px;border:1px solid #f87171;background:#fff5f5;color:#f87171;font-size:11px;cursor:pointer;">🗑 삭제</button>`;
  drawingInfoWin = new kakao.maps.CustomOverlay({ position:pos, content:el, zIndex:10, yAnchor:1.3 });
  drawingInfoWin.setMap(map);
}

function closeDrawingInfo() {
  if (drawingInfoWin) { drawingInfoWin.setMap(null); drawingInfoWin = null; }
}

async function deleteDrawing(id) {
  if (!confirm('삭제할까요?')) return;
  await window._sb.from('drawings').delete().eq('id', id).eq('user_id', (await window._sb.auth.getSession()).data.session.user.id);
  if (savedDrawingOverlays[id]) { savedDrawingOverlays[id].setMap(null); delete savedDrawingOverlays[id]; }
  closeDrawingInfo();
  loadMyDrawings();
}

/* ════════════════════════════════
   마커 메모 (Supabase 저장)
════════════════════════════════ */
let pendingMarkerLatLng = null;
let markerColor = '#ef4444';
let myMarkerOverlays = [];
let editingMarkerId = null;

function selectMarkerColor(color, el) {
  markerColor = color;
  document.querySelectorAll('.mcolor').forEach(e => e.style.border = '2px solid transparent');
  el.style.border = '2px solid #fff';
}

function openMarkerModal(latLng) {
  pendingMarkerLatLng = latLng;
  editingMarkerId = null;
  document.getElementById('markerTitle').value = '';
  document.getElementById('markerContent').value = '';
  document.querySelector('#markerModal .modal-title').textContent = '📍 마커 정보 입력';
  document.getElementById('markerModal').style.display = 'flex';
  setTimeout(() => document.getElementById('markerTitle').focus(), 100);
}

function closeMarkerModal() {
  document.getElementById('markerModal').style.display = 'none';
  pendingMarkerLatLng = null;
  editingMarkerId = null;
  document.querySelector('#markerModal .modal-title').textContent = '📍 마커 정보 입력';
}

async function saveMarker() {
  const title = document.getElementById('markerTitle').value.trim();
  if (!title) { alert('제목을 입력해주세요'); return; }
  if (!window._sb) { alert('로그인이 필요해요'); closeMarkerModal(); return; }
  const { data: { session } } = await window._sb.auth.getSession();
  if (!session) { alert('로그인이 필요해요'); closeMarkerModal(); return; }

  if (editingMarkerId) {
    // 수정 모드
    const { error } = await window._sb.from('markers').update({
      title,
      content: document.getElementById('markerContent').value,
      color: markerColor
    }).eq('id', editingMarkerId).eq('user_id', session.user.id);
    if (error) { alert('수정 실패: ' + error.message); return; }
    closeMarkerModal();
    loadMyMarkers();
  } else {
    // 신규 저장
    if (!pendingMarkerLatLng) { alert('지도에서 위치를 선택해주세요'); return; }
    const { data, error } = await window._sb.from('markers').insert({
      user_id: session.user.id,
      title,
      content: document.getElementById('markerContent').value,
      color: markerColor,
      lat: pendingMarkerLatLng.getLat(),
      lng: pendingMarkerLatLng.getLng()
    }).select().single();
    if (error) { alert('저장 실패: ' + error.message); return; }
    renderMyMarker(data);
    closeMarkerModal();
    loadMyMarkers();
  }
}

function renderMyMarker(m) {
  const pos = new kakao.maps.LatLng(m.lat, m.lng);
  const el = document.createElement('div');
  el.innerHTML = `<div style="width:24px;height:24px;border-radius:50% 50% 50% 0;background:${m.color};border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,0.4);cursor:pointer;"></div>`;
  el.style.cssText = 'transform:translate(-12px,-24px)';
  const ov = new kakao.maps.CustomOverlay({ position: pos, content: el, zIndex: 5 });
  ov.setMap(map);
  ov._markerId = m.id;
  el.addEventListener('click', () => showMarkerInfo(m, ov));
  myMarkerOverlays.push(ov);
}

let markerInfoWin = null;
function showMarkerInfo(m, ov) {
  if (markerInfoWin) { markerInfoWin.setMap(null); markerInfoWin = null; }
  const pos = new kakao.maps.LatLng(m.lat, m.lng);
  const el = document.createElement('div');

  el.innerHTML = `
    <div style="font-size:13px;font-weight:700;color:#111;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">

      <span onclick="closeMarkerInfo()" style="cursor:pointer;color:#999;font-size:15px;margin-left:8px;">✕</span>
    </div>
    ${m.content ? `<div style="font-size:12px;color:#444;line-height:1.7;margin-bottom:8px;white-space:pre-wrap;">${m.content}</div>` : ''}
    <div style="font-size:10px;color:#999;margin-bottom:8px;">${new Date(m.created_at).toLocaleString('ko')}</div>
    <div style="display:flex;gap:6px;">
      <button onclick="editMarker('${m.id}')" style="flex:1;padding:5px;border-radius:6px;border:1px solid #ddd;background:#f9f9f9;font-size:11px;cursor:pointer;">✏ 수정</button>
      <button onclick="deleteMarker('${m.id}')" style="flex:1;padding:5px;border-radius:6px;border:1px solid #f87171;background:#fff5f5;color:#f87171;font-size:11px;cursor:pointer;">🗑 삭제</button>
    </div>`;
  markerInfoWin = new kakao.maps.CustomOverlay({ position: pos, content: el, zIndex: 10, yAnchor: 1.3 });
  markerInfoWin.setMap(map);
}

function closeMarkerInfo() {
  if (markerInfoWin) { markerInfoWin.setMap(null); markerInfoWin = null; }
}

async function deleteMarker(id) {
  if (!confirm('마커를 삭제할까요?')) return;
  if (!window._sb) return;
  const { data: { session } } = await window._sb.auth.getSession();
  if (!session) return;
  const { error } = await window._sb.from('markers').delete()
    .eq('id', id).eq('user_id', session.user.id);
  if (error) { alert('삭제 실패: ' + error.message); return; }
  const idx = myMarkerOverlays.findIndex(o => o._markerId === id);
  if (idx >= 0) { myMarkerOverlays[idx].setMap(null); myMarkerOverlays.splice(idx, 1); }
  closeMarkerInfo();
  loadMyMarkers();
}

async function editMarker(id) {
  const title = prompt('새 제목:');
  if (!title) return;
  const content = prompt('새 내용:');
  await window._sb.from('markers').update({ title, content }).eq('id', id);
  closeMarkerInfo();
  loadMyMarkers();
}

async function loadMyMarkers() {
  if (!window._sb) return;
  const { data: { session } } = await window._sb.auth.getSession();
  if (!session) return;
  myMarkerOverlays.forEach(o => o.setMap(null));
  myMarkerOverlays = [];
  const { data } = await window._sb.from('markers').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
  if (!data) return;

  // 사이드바 섹션 표시
  document.getElementById('myMarkerSection').style.display = 'block';
  document.getElementById('markerCount').textContent = data.length;

  // 지도에 렌더
  data.forEach(m => renderMyMarker(m));

  // 사이드바 목록 렌더
  const listEl = document.getElementById('myMarkerList');
  if (!data.length) {
    listEl.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:var(--text3)">마커 없음</div>';
    return;
  }
  listEl.innerHTML = data.map(m => `
    <div class="layer-item" style="padding-left:10px" id="marker-item-${m.id}">
      <div style="width:8px;height:8px;border-radius:50%;background:${m.color};flex-shrink:0;"></div>
      <span class="layer-name" style="cursor:pointer" onclick="focusMarker('${m.id}',${m.lat},${m.lng})">${m.title}</span>
      <span class="layer-eye" onclick="toggleMarkerVisible('${m.id}')" title="표시/숨기기">👁</span>
      <span class="layer-eye" onclick="openEditMarkerModal('${m.id}')" title="수정">✏</span>
      <span class="layer-eye" style="color:#f87171" onclick="deleteMarker('${m.id}')" title="삭제">🗑</span>
    </div>`).join('');

  // 마커 데이터 캐시
  window._markerData = {};
  data.forEach(m => { window._markerData[m.id] = m; });
}

function focusMarker(id, lat, lng) {
  map.setCenter(new kakao.maps.LatLng(lat, lng));
  map.setLevel(3);
  const ov = myMarkerOverlays.find(o => o._markerId === id);
  const m = window._markerData?.[id];
  if (ov && m) showMarkerInfo(m, ov);
}

let hiddenMarkers = new Set();
function toggleMarkerVisible(id) {
  const ov = myMarkerOverlays.find(o => o._markerId === id);
  if (!ov) return;
  if (hiddenMarkers.has(id)) {
    hiddenMarkers.delete(id);
    ov.setMap(map);
    document.querySelector(`#marker-item-${id} .layer-eye`).textContent = '👁';
  } else {
    hiddenMarkers.add(id);
    ov.setMap(null);
    document.querySelector(`#marker-item-${id} .layer-eye`).textContent = '🚫';
  }
}

// 마커 수정 모달
function openEditMarkerModal(id) {
  const m = window._markerData?.[id];
  if (!m) return;
  editingMarkerId = id;
  document.getElementById('markerTitle').value = m.title;
  document.getElementById('markerContent').value = m.content || '';
  markerColor = m.color;
  document.querySelectorAll('.mcolor').forEach(e => {

  });

}

/* ════════════════════════════════
   이미지 오버레이
════════════════════════════════ */
let overlayFile = null;
let overlayPoints = [];
let overlayClickListener = null;
let overlayPreviewList = [];

function openOverlayPanel() {
  document.getElementById('overlayPanel').style.display = 'block';
  loadMyOverlays();
}
function closeOverlayPanel() {
  document.getElementById('overlayPanel').style.display = 'none';
  cancelOverlayPick();
}

function handleOverlayDrop(e) {
  e.preventDefault();
  handleOverlayFile(e.dataTransfer.files[0]);
}

function handleOverlayFile(file) {
  if (!file) return;
  overlayFile = file;
  document.getElementById('overlayDropZone').innerHTML = `<div style="font-size:12px;color:var(--accent)">📎 ${file.name}</div>`;
  document.getElementById('overlayTitle').value = file.name.replace(/\.[^.]+$/, '');
  startOverlayPick();
}

function startOverlayPick() {
  overlayPoints = [];
  updateOverlayStatus('지도에서 좌측하단(SW) 지점을 클릭하세요 (1/2)');
  map.setDraggable(false);
  overlayClickListener = kakao.maps.event.addListener(map, 'click', e => {
    overlayPoints.push(e.latLng);
    if (overlayPoints.length === 1) {
      updateOverlayStatus('우측상단(NE) 지점을 클릭하세요 (2/2)');
      // SW 임시 마커
      const dot = document.createElement('div');
      dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:#4ade80;border:2px solid #fff;';
      new kakao.maps.CustomOverlay({ position: e.latLng, content: dot, zIndex: 20 }).setMap(map);
    } else if (overlayPoints.length === 2) {
      cancelOverlayPick();
      document.getElementById('overlaySubmitBtn').disabled = false;
      document.getElementById('overlaySubmitBtn').style.opacity = '1';
      updateOverlayStatus('✅ 위치 지정 완료! 저장 버튼을 누르세요');
    }
  });
}

function cancelOverlayPick() {
  if (overlayClickListener) {
    kakao.maps.event.removeListener(map, 'click', overlayClickListener);
    overlayClickListener = null;
  }
  map.setDraggable(true);
}

function updateOverlayStatus(msg) {
  const el = document.getElementById('overlayStatus');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function renderOverlayOnMap(o) {
  const sw = new kakao.maps.LatLng(o.sw_lat, o.sw_lng);
  const ne = new kakao.maps.LatLng(o.ne_lat, o.ne_lng);
  // 지도상 픽셀 위치 계산해서 이미지 오버레이
  const bounds = new kakao.maps.LatLngBounds(sw, ne);
  const img = document.createElement('img');
  img.src = o.url;
  img.style.cssText = `width:100%;height:100%;opacity:${o.opacity};pointer-events:none;`;
  // CustomOverlay로 bounds에 맞게 렌더
  const proj = map.getProjection();
  const swPt = proj.pointFromCoords(sw);
  const nePt = proj.pointFromCoords(ne);
  const w = Math.abs(nePt.x - swPt.x);
  const h = Math.abs(nePt.y - swPt.y);
  const wrap = document.createElement('div');
  wrap.style.cssText = `width:${w}px;height:${h}px;position:absolute;`;
  wrap.appendChild(img);
  const center = new kakao.maps.LatLng((o.sw_lat + o.ne_lat) / 2, (o.sw_lng + o.ne_lng) / 2);
  const ov = new kakao.maps.CustomOverlay({ position: center, content: wrap, zIndex: 1 });
  ov.setMap(map);
  ov._overlayId = o.id;
  overlayPreviewList.push(ov);
}

async function loadMyOverlays() {
  if (!window._sb) return;
  const { data: { session } } = await window._sb.auth.getSession();
  if (!session) return;

  const { data } = await window._sb.from('image_overlays').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });

  // 사이드바 섹션 표시
  document.getElementById('myOverlaySection').style.display = data?.length ? 'block' : 'none';
  document.getElementById('overlayCount').textContent = data?.length || 0;

  // 패널 내 목록
  const panelList = document.getElementById('myOverlayList');
  // 사이드바 목록
  const sidebarList = document.getElementById('mySidebarOverlayList');

  if (!data?.length) {
    panelList.innerHTML = '<div style="font-size:11px;color:var(--text3);text-align:center;padding:8px;">저장된 오버레이 없음</div>';
    sidebarList.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:var(--text3)">오버레이 없음</div>';
    return;
  }

  // 캐시
  window._overlayData = {};
  data.forEach(o => { window._overlayData[o.id] = o; });

  const itemHtml = (o) => `
    <div class="layer-item" style="padding-left:10px" id="overlay-item-${o.id}">
      <span style="font-size:14px;">🖼</span>
      <span class="layer-name" style="cursor:pointer" onclick="focusOverlay('${o.id}')">${o.title}</span>
      <span class="layer-eye" onclick="toggleOverlayVisible('${o.id}')" title="표시/숨기기">👁</span>
      <span class="layer-eye" onclick="openEditOverlayPanel('${o.id}')" title="수정">✏</span>
      <span class="layer-eye" style="color:#f87171" onclick="deleteOverlay('${o.id}')" title="삭제">🗑</span>
    </div>`;

  panelList.innerHTML = data.map(o => `
    <div style="display:flex;align-items:center;gap:6px;padding:5px 4px;border-top:1px solid var(--border);">
      <span style="font-size:11px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${o.title}</span>
      <button onclick="openEditOverlayPanel('${o.id}')" style="font-size:10px;padding:2px 5px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;">수정</button>
      <button onclick="deleteOverlay('${o.id}')" style="font-size:10px;padding:2px 5px;border-radius:4px;border:1px solid #f87171;background:transparent;color:#f87171;cursor:pointer;">삭제</button>
    </div>`).join('');

  sidebarList.innerHTML = data.map(o => itemHtml(o)).join('');

  // 지도에 렌더
  overlayPreviewList.forEach(o => { if(o.setMap) o.setMap(null); });
  overlayPreviewList = [];
  data.forEach(o => {
    const { data: urlData } = window._sb.storage.from('overlay-images').getPublicUrl(o.storage_path);
    renderOverlayOnMap({ ...o, url: urlData.publicUrl });
  });
}

let hiddenOverlays = new Set();
function toggleOverlayVisible(id) {
  const idx = overlayPreviewList.findIndex(o => o._overlayId === id);
  if (idx < 0) return;
  const ov = overlayPreviewList[idx];
  const eyeEl = document.querySelectorAll(`#overlay-item-${id} .layer-eye`)[0];
  if (hiddenOverlays.has(id)) {
    hiddenOverlays.delete(id);
    ov.setMap(map);
    if (eyeEl) eyeEl.textContent = '👁';
  } else {
    hiddenOverlays.add(id);
    ov.setMap(null);
    if (eyeEl) eyeEl.textContent = '🚫';
  }
}

function focusOverlay(id) {
  const o = window._overlayData?.[id];
  if (!o) return;
  const center = new kakao.maps.LatLng((o.sw_lat + o.ne_lat) / 2, (o.sw_lng + o.ne_lng) / 2);
  map.setCenter(center);
  map.setLevel(4);
}

// 오버레이 수정 패널
let editingOverlayId = null;
function openEditOverlayPanel(id) {
  const o = window._overlayData?.[id];
  if (!o) return;
  editingOverlayId = id;
  document.getElementById('overlayPanel').style.display = 'block';
  document.getElementById('overlayTitle').value = o.title;
  document.getElementById('overlayOpacity').value = Math.round(o.opacity * 100);
  document.getElementById('opacityVal').textContent = Math.round(o.opacity * 100) + '%';
  document.getElementById('overlayDropZone').innerHTML = `<div style="font-size:12px;color:var(--accent)">📎 저장된 이미지 (위치 재지정 가능)</div>`;
  overlayPoints = [];
  overlayFile = null;
  // 수정 모드 안내
  document.getElementById('overlayStatus').textContent = '위치를 재지정하려면 지도에서 클릭하세요 (선택사항)';
  document.getElementById('overlayStatus').style.display = 'block';
  document.getElementById('overlaySubmitBtn').disabled = false;
  document.getElementById('overlaySubmitBtn').style.opacity = '1';
  document.getElementById('overlaySubmitBtn').textContent = '수정 저장';
}

async function saveOverlay() {
  if (!window._sb) { alert('로그인이 필요해요'); return; }
  const { data: { session } } = await window._sb.auth.getSession();
  if (!session) { alert('로그인이 필요해요'); return; }

  // 수정 모드
  if (editingOverlayId) {
    const updateData = {
      title: document.getElementById('overlayTitle').value || '이미지 오버레이',
      opacity: document.getElementById('overlayOpacity').value / 100
    };
    // 위치 재지정 시
    if (overlayPoints.length === 2) {
      updateData.sw_lat = overlayPoints[0].getLat();
      updateData.sw_lng = overlayPoints[0].getLng();
      updateData.ne_lat = overlayPoints[1].getLat();
      updateData.ne_lng = overlayPoints[1].getLng();
    }
    await window._sb.from('image_overlays').update(updateData)
      .eq('id', editingOverlayId).eq('user_id', session.user.id); // 본인만 수정
    editingOverlayId = null;
    overlayPoints = [];
    document.getElementById('overlaySubmitBtn').textContent = '위치 지정 후 저장';
    updateOverlayStatus('✅ 수정 완료!');
    closeOverlayPanel();
    loadMyOverlays();
    return;
  }

  // 신규 저장
  if (!overlayFile || overlayPoints.length < 2) { alert('이미지와 위치를 먼저 지정해주세요'); return; }
  updateOverlayStatus('업로드 중...');
  const ext = overlayFile.name.split('.').pop();
  const path = `${session.user.id}/${Date.now()}.${ext}`;
  const { error: upErr } = await window._sb.storage.from('overlay-images').upload(path, overlayFile);
  if (upErr) { alert('업로드 실패: ' + upErr.message); return; }
  const { data: urlData } = window._sb.storage.from('overlay-images').getPublicUrl(path);
  const sw = overlayPoints[0], ne = overlayPoints[1];
  await window._sb.from('image_overlays').insert({
    user_id: session.user.id,
    title: document.getElementById('overlayTitle').value || '이미지 오버레이',
    storage_path: path,
    sw_lat: sw.getLat(), sw_lng: sw.getLng(),
    ne_lat: ne.getLat(), ne_lng: ne.getLng(),
    opacity: document.getElementById('overlayOpacity').value / 100
  });
  renderOverlayOnMap({ title: document.getElementById('overlayTitle').value, url: urlData.publicUrl,
    sw_lat: sw.getLat(), sw_lng: sw.getLng(), ne_lat: ne.getLat(), ne_lng: ne.getLng(),
    opacity: document.getElementById('overlayOpacity').value / 100 });
  updateOverlayStatus('✅ 저장 완료!');
  overlayFile = null; overlayPoints = [];
  document.getElementById('overlaySubmitBtn').disabled = true;
  document.getElementById('overlaySubmitBtn').style.opacity = '.5';
  loadMyOverlays();
}

async function deleteOverlay(id) {
  if (!confirm('오버레이를 삭제할까요?')) return;
  if (!window._sb) return;
  const { data: { session } } = await window._sb.auth.getSession();
  if (!session) return;
  await window._sb.from('image_overlays').delete().eq('id', id).eq('user_id', session.user.id); // 본인만 삭제
  loadMyOverlays();
}

/* ════════════════════════════════
   지적편집도
════════════════════════════════ */
let cadastralOn = false;
function toggleCadastral() {
  cadastralOn = !cadastralOn;
  const btn = document.getElementById('cadastralBtn');
  if (cadastralOn) {
    map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
    btn.className = 'cadastral-btn on';
    btn.innerHTML = '<span>🗺</span> 지적편집도 ON';
  } else {
    map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
    btn.className = 'cadastral-btn';
    btn.innerHTML = '<span>🗺</span> 지적편집도';
  }
}

/* ════════════════════════════════
   유틸
════════════════════════════════ */
function loading(msg) {
  const pill = document.getElementById('loadingPill');
  const txt = document.getElementById('loadingText');
  pill.className = 'loading-pill' + (msg ? ' show' : '');
  if (txt) txt.textContent = msg;
}

/* ════════════════════════════════
   범례 드래그
════════════════════════════════ */
function initDraggable(el) {
  let isDragging = false, startX, startY, startLeft, startTop;
  el.addEventListener('mousedown', e => {
    if (e.target.tagName === 'INPUT') return;
    isDragging = true;
    startX = e.clientX; startY = e.clientY;
    const rect = el.getBoundingClientRect();
    startLeft = rect.left; startTop = rect.top;
    el.style.bottom = 'auto'; el.style.right = 'auto';
    el.style.left = startLeft + 'px'; el.style.top = startTop + 'px';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    el.style.left = Math.max(0, startLeft + dx) + 'px';
    el.style.top = Math.max(0, startTop + dy) + 'px';
  });
  document.addEventListener('mouseup', () => { isDragging = false; });
}

/* ════════════════════════════════
   시작
════════════════════════════════ */
window.addEventListener('load', () => {
  kakao.maps.load(() => {
    init();
    initDraggable(document.getElementById('mapLegend'));
  });
});
